name: Refresh contribution arcade
on:
  schedule:
    - cron: '25 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/contribution_arcade.py
      - name: Publish updated calendar
        run: |
          git add pacman.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh contribution calendar'
          git push
